<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Reader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Speed Reader</h1>
            <p>Paste your text below and start reading.</p>
        </header>

        <main>
            <div id="reader-display" class="reader-display">
                <span id="current-word">Ready</span>
            </div>

            <div class="controls">
                <div class="control-group">
                    <button id="btn-play" class="btn btn-primary">Play</button>
                    <button id="btn-pause" class="btn btn-secondary">Pause</button>
                    <button id="btn-reset" class="btn btn-secondary">Reset</button>
                </div>
                <div class="control-group">
                    <label for="wpm-input">WPM:</label>
                    <input type="number" id="wpm-input" value="300" min="50" max="1000" step="10">
                </div>
            </div>

            <div class="source-container">
                <div id="source-text" class="source-text" contenteditable="true" spellcheck="false">
                    Paste your text here to begin speed reading. This is a sample text to demonstrate how the application works. click Play above to start reading this text at the selected speed.
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
